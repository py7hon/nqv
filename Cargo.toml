[package]
name = "nqv"
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Iqbal Rifai <https://github.com/py7hon>"]
description = "NQV: A hardware-accelerated (AVX2), high-throughput Quasigroup Vector cipher implementation in pure Rust."
readme = "README.md"
repository = "https://github.com/py7hon"
license = "Apache-2.0"
keywords = ["cryptography", "avx2", "quasigroup", "encryption", "simd"]
categories = ["cryptography", "algorithms"]
autobenches = false

[lib]
name = "nqv"
path = "src/lib.rs"

[[bin]]
name = "nqv-benchmark"
path = "benches/nqv_benchmark.rs"

[dependencies]
# Zero external dependencies for core NQV library

[dev-dependencies]
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
aead = "0.5.2"
crypto-common = "0.1.7"
generic-array = "0.14.7"
rand = "0.8.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[build]
rustflags = ["-C", "target-feature=+avx2", "-C", "target-cpu=native"]